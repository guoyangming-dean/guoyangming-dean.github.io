{% assign timeline_items = include.items | default: site.data.timeline %}

{% if timeline_items %}
  <ol class="custom-timeline">
    {% for item in timeline_items %}
      <li class="custom-timeline__item">
        <div class="custom-timeline__track" aria-hidden="true">
          <span class="custom-timeline__marker">
            <svg class="custom-timeline__icon" viewBox="0 0 20 20" focusable="false">
              <path d="M10 2.25a.75.75 0 0 1 .75.75v1.25H14A2.75 2.75 0 0 1 16.75 7v7A2.75 2.75 0 0 1 14 16.75H6A2.75 2.75 0 0 1 3.25 14V7A2.75 2.75 0 0 1 6 4.25h3.25V3a.75.75 0 0 1 .75-.75Zm-4 3.5A1.25 1.25 0 0 0 4.75 7v7A1.25 1.25 0 0 0 6 15.25h8A1.25 1.25 0 0 0 15.25 14V7A1.25 1.25 0 0 0 14 5.75H6Zm1.25 4A.75.75 0 0 1 8 9h4a.75.75 0 0 1 0 1.5H8a.75.75 0 0 1-.75-.75Zm0 3A.75.75 0 0 1 8 12h2.5a.75.75 0 0 1 0 1.5H8a.75.75 0 0 1-.75-.75Z"></path>
            </svg>
          </span>
        </div>
        <div class="custom-timeline__card">
          <time class="custom-timeline__date" datetime="{{ item.date }}">{{ item.date }}</time>
          <h3 class="custom-timeline__title">{{ item.title }}</h3>
          {% if item.description %}
            <p class="custom-timeline__description">{{ item.description }}</p>
          {% endif %}
        </div>
      </li>
    {% endfor %}
  </ol>
{% endif %}
