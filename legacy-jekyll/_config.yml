# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
# 网站标题
title: Yangming Guo
# 联系邮箱（显示在网站页脚和关于页面）
email: yangmingbit@gmail.com
# 网站描述（用于SEO和社交媒体分享）
description: >- # this means to ignore newlines until "baseurl:"
  Personal blog and portfolio of Yangming Guo - Master's in Control Science and Engineering, Senior Algorithm Engineer specializing in AI, ML, and robotics.
# 社交媒体用户名（需要替换为实际用户名）
twitter_username: username
github_username: username
# 主题皮肤和搜索功能
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 10 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
# Jekyll插件配置
# 这些插件扩展了Jekyll的功能，如分页、站点地图、订阅等
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

# 作者信息配置
# name: 显示在网站上的姓名
# avatar: 头像图片路径
# bio: 个人简介（已设为空字符串，不在头像下方显示）
author:
  name   : "Yangming Guo"
  avatar : "/assets/images/avatar.jpg"
  bio    : ""
  links: []

footer:
  links: []

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # assets/notes
  - scope:
      path: "assets/notes"
    values:
      layout: single
      author_profile: false
      classes:
        - notes-page
      toc: true
      toc_sticky: true
      toc_label: "Outline"
      toc_icon: "list"
      permalink: /assets/notes/:basename/

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

kramdown:
  input: GFM
  math_engine: mathjax

optional_front_matter:
  remove_originals: true

titles_from_headings:
  enabled: true
  strip_title: true
